name: 自动更新第三方软件

on:
  schedule:
    # GitHub Actions 的 cron 使用 UTC；北京时间 01:00 = UTC 17:00（前一天）
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 运行更新脚本（免下载，读取 GitHub API digest）
        run: python3 myscoop-update.py --all

      - name: 提交 manifest 变更
        run: |
          if git diff --quiet -- bucket/; then
            echo "无 manifest 变更，跳过提交"
            exit 0
          fi
          git config user.name "myscoop-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bucket/
          git commit -m "自动更新第三方软件"

      - name: 更新 progress.md 提交历史
        run: |
          python3 - <<'EOF'
          # -*- coding: utf-8 -*-
          import subprocess
          p = '.claude/skills-myscoop/progress.md'
          data = open(p, 'rb').read()
          nl = b'\r\n' if b'\r\n' in data else b'\n'
          hdr = '## 提交历史'.encode('utf-8')
          end = '## 新会话启动指南'.encode('utf-8')
          hdr_pos = data.index(hdr); end_pos = data.index(end)
          head = data[:hdr_pos]; tail = data[end_pos:]
          desc = '每次提交完成后，将 `git log --oneline --decorate --graph` 输出更新到此处：'.encode('utf-8')
          graph = subprocess.run(['git', '-c', 'i18n.logOutputEncoding=utf-8', 'log', '--oneline', '--decorate', '--graph'], capture_output=True).stdout
          graph = graph.replace(b'\n', nl)
          if not graph.endswith(nl): graph += nl
          block = hdr + nl + nl + desc + nl + nl + b'```' + nl + graph + b'```' + nl + nl
          open(p, 'wb').write(head + block + tail)
          print('progress.md 提交历史已更新')
          EOF
          if ! git diff --quiet -- .claude/skills-myscoop/progress.md; then
            git add .claude/skills-myscoop/progress.md
            git commit -m "progress.md 更新提交历史"
          fi

      - name: 推送
        run: |
          git pull --rebase origin main || true
          git push origin main