name: 自动更新第三方软件

on:
  schedule:
    # GitHub Actions 的 cron 使用 UTC；北京时间 21:00 = UTC 13:00（前一天）
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 串行化：避免定时运行与手动 dispatch 重叠，导致 progress.md 提交历史互相冲突
concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai  # CI 提交用北京时区，README 日期列显示中国日期
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: 配置 git 身份
        run: |
          git config user.name "myscoop-bot"
          git config user.email "actions@users.noreply.github.com"

      # Ubuntu runner 只有 pwsh（PowerShell 7），而更新脚本的 checkver.script 调用的是 `powershell`。
      # 建一个软链接，让 foxmail.json 等使用 checkver.script 的清单能正常检测版本。
      - name: 准备 PowerShell（Ubuntu 上补 powershell 命令）
        run: |
          if ! command -v powershell >/dev/null 2>&1 && command -v pwsh >/dev/null 2>&1; then
            sudo ln -sf "$(command -v pwsh)" /usr/local/bin/powershell
            echo "已创建 powershell -> pwsh 软链接"
          fi
          if command -v powershell >/dev/null 2>&1; then
            powershell -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          else
            echo "powershell 不可用；使用 checkver.script 的清单将被跳过"
          fi

      - name: 运行更新脚本（免下载，读取 GitHub API digest）
        id: upd
        continue-on-error: true
        env:
          # Actions 自动提供的临时令牌：仅本仓库、只在本次 job 运行期有效、无需手工配置 secret。
          # 把 GitHub API 配额从匿名 60 次/小时提到 5000 次/小时——否则 --all 查 140+ 清单必然 403 限流。
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 myscoop-update.py --all 2>&1 | tee /tmp/update.log

      - name: 一致性校验（README ↔ bucket ↔ progress）
        id: chk
        continue-on-error: true
        run: |
          set -o pipefail
          python3 myscoop-update.py --check 2>&1 | tee /tmp/check.log

      - name: 提交 manifest 变更（先提交，README 日期列才能取到当天提交）
        run: |
          if git diff --quiet -- bucket/; then
            echo "无 manifest 变更，跳过提交"
            exit 0
          fi
          git add bucket/
          git commit -m "自动更新第三方软件"

      - name: 同步 README 第三方版本列（= 清单 version 原样，幂等；逻辑内联，tools/ 不入库）
        run: |
          python3 - <<'PYEOF'
          # -*- coding: utf-8 -*-
          """内联版 tools/sync_readme_versions.py（供 auto-update.yml 嵌入式使用；本文件为验证用）。
          README 版本列（第三方表=清单 version 原样）+ 时间列（git 提交日期），幂等。"""
          import json
          import re
          import subprocess
          from datetime import date
          from pathlib import Path
          
          ROOT = Path('.')
          README = ROOT / 'README.md'
          BUCKET = ROOT / 'bucket'
          
          
          def git_date(app, first):
              args = ['git', 'log']
              if first:
                  args += ['--diff-filter=A', '-1']
              else:
                  args += ['-1']
              args += ['--format=%ad', '--date=short', '--', str(BUCKET / f'{app}.json')]
              try:
                  out = subprocess.run(args, capture_output=True, text=True, cwd=ROOT, timeout=30).stdout.strip()
                  return out or None
              except Exception:
                  return None
          
          
          changed = 0
          lines = README.read_text(encoding='utf-8').splitlines()
          new_lines = list(lines)
          in_third = False
          for i, line in enumerate(lines):
              if line.startswith('### 第三方官方'):
                  in_third = True
                  continue
              if line.startswith('### 本地维护'):
                  in_third = False
                  continue
              if not re.match(r'^\|\s*\d+\s*\|', line):
                  continue
              m = re.search(r'`scoop install ([a-z0-9._-]+)(?:@[^`\s]+)?`', line)
              if not m:
                  continue
              app = m.group(1)
              mp = BUCKET / f'{app}.json'
              if not mp.exists():
                  continue
              cells = [c.strip() for c in line.split('|')]
              while len(cells) < 8:
                  cells.append('')
              edits = []
              if in_third:
                  try:
                      ver = str(json.loads(mp.read_text(encoding='utf-8')).get('version') or '')
                  except Exception:
                      ver = ''
                  if ver and cells[5] != ver:
                      edits.append((5, ver))
              created = git_date(app, True) or date.today().isoformat()
              updated = git_date(app, False) or date.today().isoformat()
              if cells[6] != created:
                  edits.append((6, created))
              if cells[7] != updated:
                  edits.append((7, updated))
              if edits:
                  tag = '第三方' if in_third else '本地'
                  print(f'[同步] {tag} {app}: ' + ', '.join(
                      f"{'版本' if idx == 5 else '创建' if idx == 6 else '更新'}→{v}" for idx, v in edits))
                  changed += 1
                  for idx, v in edits:
                      cells[idx] = v
                  new_lines[i] = '| ' + ' | '.join(cells[1:8]) + ' |'
          if changed:
              README.write_text('\n'.join(new_lines) + '\n', encoding='utf-8')
          print(f'共 {changed} 行更新')
          PYEOF

      - name: 提交 README 变更
        run: |
          if git diff --quiet -- README.md; then
            echo "README 无变更，跳过提交"
            exit 0
          fi
          git add README.md
          git commit -m "同步 README 第三方版本与日期列"

      # 先拉取再生成提交历史：避免基于旧 git log 生成的“提交历史”块与远端冲突
      - name: 拉取远端（rebase）
        run: |
          git pull --rebase origin main

      - name: 更新 progress.md 提交历史
        run: |
          python3 - <<'EOF'
          # -*- coding: utf-8 -*-
          import subprocess
          p = '.claude/skills-myscoop/progress.md'
          data = open(p, 'rb').read()
          nl = b'\r\n' if b'\r\n' in data else b'\n'
          hdr = '## 提交历史'.encode('utf-8')
          end = '## 新会话启动指南'.encode('utf-8')
          hdr_pos = data.index(hdr); end_pos = data.index(end)
          head = data[:hdr_pos]; tail = data[end_pos:]
          desc = '每次提交完成后，将 `git log --oneline --decorate --graph --decorate-refs-exclude=refs/tags/*` 输出更新到此处（必须排除标签装饰——95 个 release 锚点标签全指向同一快照提交，不排除时该行可达数千字符）：'.encode('utf-8')
          graph = subprocess.run(['git', '-c', 'i18n.logOutputEncoding=utf-8', 'log', '--oneline', '--decorate', '--graph', '--decorate-refs-exclude=refs/tags/*'], capture_output=True).stdout
          graph = graph.replace(b'\n', nl)
          if not graph.endswith(nl): graph += nl
          block = hdr + nl + nl + desc + nl + nl + b'```' + nl + graph + b'```' + nl + nl
          open(p, 'wb').write(head + block + tail)
          print('progress.md 提交历史已更新')
          EOF
          if ! git diff --quiet -- .claude/skills-myscoop/progress.md; then
            git add .claude/skills-myscoop/progress.md
            git commit -m "progress.md 更新提交历史"
          fi

      - name: 推送（失败自动拉取重试）
        run: |
          for i in 1 2 3; do
            if git push origin main; then
              echo "推送成功"
              exit 0
            fi
            echo "推送被拒，拉取后重试 ($i/3)"
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::rebase 冲突，停止重试"
              exit 1
            fi
            sleep 5
          done
          exit 1

      # 更新/校验异常不阻断提交推送（上面已 continue-on-error），但让 job 在末尾变红以便发现
      - name: 异常汇总（有异常则让 job 失败）
        if: steps.upd.outcome == 'failure' || steps.chk.outcome == 'failure'
        run: |
          echo "::error::myscoop-update.py 更新或一致性校验存在异常，请查看上方日志"
          exit 1

      # 把更新过程中的 [警告]/[错误]/[跳过]（含对应 json）与异常汇总推送到企业微信。
      # Webhook URL 只从 Secret 读取（Settings → Secrets and variables → Actions → WECHAT_WEBHOOK_URL），
      # 绝不写入仓库或日志；未配置时自动跳过。
      - name: 汇总异常并推送企业微信
        if: always()
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          UPD_OUTCOME: ${{ steps.upd.outcome }}
          CHK_OUTCOME: ${{ steps.chk.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          # -*- coding: utf-8 -*-
          import os
          import re
          import json
          import datetime
          import urllib.request

          def read(path):
              try:
                  return open(path, encoding='utf-8', errors='replace').read()
              except FileNotFoundError:
                  return ''

          ansi = re.compile(r'\x1b\[[0-9;]*m')
          upd = ansi.sub('', read('/tmp/update.log'))
          chk = ansi.sub('', read('/tmp/check.log'))

          imp_re = re.compile(r'\[(警告|错误|跳过|异常)\]|Traceback \(most recent call last\)|^\s*Error:|^\s*错误[:：]')
          summaries, important = [], []
          for label, text in (('更新', upd), ('校验', chk)):
              for line in text.splitlines():
                  s = line.strip()
                  if not s:
                      continue
                  if re.match(r'^===.*(已更新|可更新|异常|一致|不一致).*===$', s):
                      summaries.append(s)
                  if imp_re.search(s):
                      important.append(s if s.startswith('[') else f'[{label}] {s}')

          if 'Traceback (most recent call last)' in upd:
              tail = [l.strip() for l in upd.splitlines() if l.strip()][-8:]
              important.extend('[更新异常] ' + t[:200] for t in tail)

          def uniq(xs):
              seen, out = set(), []
              for x in xs:
                  if x not in seen:
                      seen.add(x)
                      out.append(x)
              return out

          important, summaries = uniq(important), uniq(summaries)
          failed = (os.environ.get('UPD_OUTCOME') == 'failure') or (os.environ.get('CHK_OUTCOME') == 'failure')

          if not important and not failed:
              print('无警告/错误，跳过企业微信推送')
              raise SystemExit(0)

          now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')
          head = '🚨' if failed else '⚠️'
          lines = [
              f"{head} myscoop 自动更新{'失败' if failed else '有告警'}",
              f"仓库: {os.environ.get('REPO', '')}",
              f"触发: {os.environ.get('TRIGGER', '')}  时间: {now}",
              f"更新脚本: {os.environ.get('UPD_OUTCOME', '?')}  一致性校验: {os.environ.get('CHK_OUTCOME', '?')}",
          ]
          if summaries:
              lines.append('汇总: ' + ' | '.join(summaries[:5]))
          lines.append(f"运行: {os.environ.get('RUN_URL', '')}")
          if important:
              lines.append('—— 警告/错误/跳过 ——')
              for s in important[:30]:
                  lines.append(s[:200])
              if len(important) > 30:
                  lines.append(f'…（还有 {len(important) - 30} 条，详见 Actions 日志）')

          content = '\n'.join(lines)
          b = content.encode('utf-8')
          if len(b) > 1800:  # 企业微信 text 上限 2048 字节，留余量
              content = b[:1780].decode('utf-8', 'ignore') + '\n…（已截断，详见 Actions 日志）'

          url = os.environ.get('WECHAT_WEBHOOK_URL', '').strip()
          if not url:
              print('未配置 secrets.WECHAT_WEBHOOK_URL，跳过推送')
              raise SystemExit(0)

          payload = json.dumps({'msgtype': 'text', 'text': {'content': content}}, ensure_ascii=False).encode('utf-8')
          req = urllib.request.Request(url, data=payload, headers={'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  print('企业微信推送成功，HTTP', resp.status)
          except Exception as e:
              print('企业微信推送失败（不影响 job）:', type(e).__name__, str(e)[:200])
          PY
